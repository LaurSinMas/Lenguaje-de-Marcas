<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de Nombre</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>¿Te gusta tu nombre?</legend>
            <input type="radio" id="si" name="pregunta" value="si">
            <label for="si">Sí</label><br>
            <input type="radio" id="no" name="pregunta" value="no">
            <label for="no">No</label><br>
            <input type="radio" id="no-se" name="pregunta" value="no-se">
            <label for="no-se">Nunca lo he pensado</label>

            <br><br>
            <label for="desplegable">Selecciona el nombre que te quieres poner:</label>
            <select id="desplegable" name="nombre-elegido">
                <option value="" selected disabled>Elige un nombre</option>
                <option value="nombre1">Manolo</option>
                <option value="nombre2">María</option>
                <option value="nombre3">Juan</option>
            </select>
            <br><br>
            <label for="otro">Si no te gusta ninguno de los nombres anteriores, escribe el nombre que te gustaría tener:</label>
            <input type="text" id="otro" name="otro-nombre" placeholder="Nombre">
            <br><br>
            <label for="valora-experiencia">Valora tu experiencia en esta actividad:</label>
            <input type="range" id="valora-experiencia" name="valora-experiencia" min="1" max="5" step="1">
            <br><br>
            <input type="submit" value="Enviar"><a href="Página_5.html">Enviar</a>
            <input type="reset" value="Restablecer">
        </fieldset>
    </form>
</body>
</html>
