<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/calculadora.js"></script>
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora</h1>
    <table>
        <thead>
            <tr>
                <td colspan="4"><input type="text" value="0" id="pantalla"readonly></td>
            </tr>
        </thead>
        <tbody>
            <!-- Las filas de la tabla se llenarán con JavaScript -->
            <tr>
                <th><button onclick="escribir('%')">%</button></th>
                <th><button onclick="escribir('CE')">CE</button></th>
                <th><button onclick="borrar('C')">C</button></th>
                <th><button onclick="escribir('⌫')">⌫</button></th>
            </tr>
            <tr>
                <th><button onclick="escribir('7')">7</button></th>
                <th><button onclick="escribir('8')">8</button></th>
                <th><button onclick="escribir('9')">9</button></th>
                <th><button onclick="escribir('/')">/</button></th>
            </tr>
            <tr>
                <th><button onclick="escribir('4')">4</button></th>
                <th><button onclick="escribir('5')">5</button></th>
                <th><button onclick="escribir('6')">6</button></th>
                <th><button onclick="escribir('*')">*</button></th>
            </tr>
            <tr>
                <th><button onclick="escribir('1')">1</button></th>
                <th><button onclick="escribir('2')">2</button></th>
                <th><button onclick="escribir('3')">3</button></th>
                <th><button onclick="escribir('-')">-</button></th>
            </tr>
            <tr>
                <th><button onclick="escribir('0')">0</button></th>
                <th><button onclick="escribir(',')">.</button></th>
                <th><button onclick="calcular()">=</button></th>
                <th><button onclick="escribir('+')">+</button></th>
            </tr>
        </tbody>
    </table>
</body>
</html>
