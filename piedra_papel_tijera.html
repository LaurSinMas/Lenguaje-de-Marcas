<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Piedra, papel o tijera</title>
        <script src="../js/piedra_papel_tijera.js" defer></script>
    </head>
    <body>
        <main>
            <div class="opciones">
                <button type="button" onclick="jugar('piedra')">Piedra</button>
                <button type="button" onclick="jugar('papel')">Papel</button>
                <button type="button" onclick="jugar('tijera')">Tijera</button>
            </div>

            <p id="marcador">Partidas jugadas: 0</p>
            <p id="ganadas">Partidas ganadas: 0</p>
            <p id="perdidas">Partidas perdidas: 0</p>
            <p id="empatadas">Partidas empatadas: 0</p>

            <section id="resultado">
                <h2>resultado</h2>
                <p id="jugada-jugador">Tu jugada aparecerá aquí</p>
                <p id="jugada-maquina">La maquina eligió</p>
                <p id="mensaje"></p>
            </section>
        </main>
    </body>
</html>
