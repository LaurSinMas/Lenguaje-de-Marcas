        <a href="formulario.html">Formulario</a>

            </div>
        </div>
    </nav>
    <main class="pagina-calculadora">
        <h1>Calculadora</h1>
        <section class="calculadora" aria-label="Calculadora">
            <input id="pantalla" class="pantalla" type="text" value="0" aria-label="Pantalla de la calculadora" aria-live="polite" readonly>
            <div class="teclado">
                <button class="tecla tecla-funcion" type="button" data-action="percent" aria-label="Porcentaje">%</button>
                <button class="tecla tecla-funcion" type="button" data-action="clear-entry" aria-label="Borrar entrada">CE</button>
                <button class="tecla tecla-funcion" type="button" data-action="clear" aria-label="Borrar todo">C</button>
                <button class="tecla tecla-funcion" type="button" data-action="backspace" aria-label="Borrar último dígito">⌫</button>

                <button class="tecla tecla-numero" type="button" data-digit="7">7</button>
                <button class="tecla tecla-numero" type="button" data-digit="8">8</button>
                <button class="tecla tecla-numero" type="button" data-digit="9">9</button>
                <button class="tecla tecla-operador" type="button" data-operator="/" aria-label="Dividir">÷</button>

                <button class="tecla tecla-numero" type="button" data-digit="4">4</button>
                <button class="tecla tecla-numero" type="button" data-digit="5">5</button>
                <button class="tecla tecla-numero" type="button" data-digit="6">6</button>
                <button class="tecla tecla-operador" type="button" data-operator="*" aria-label="Multiplicar">×</button>

                <button class="tecla tecla-numero" type="button" data-digit="1">1</button>
                <button class="tecla tecla-numero" type="button" data-digit="2">2</button>
                <button class="tecla tecla-numero" type="button" data-digit="3">3</button>
                <button class="tecla tecla-operador" type="button" data-operator="-" aria-label="Restar">−</button>

                <button class="tecla tecla-numero" type="button" data-digit="0">0</button>
                <button class="tecla tecla-numero" type="button" data-action="decimal" aria-label="Separador decimal">.</button>
                <button class="tecla tecla-igual" type="button" data-action="equals" aria-label="Igual">=</button>
                <button class="tecla tecla-operador" type="button" data-operator="+" aria-label="Sumar">+</button>
            </div>
        </section>
    </main>
</body>
</html>
